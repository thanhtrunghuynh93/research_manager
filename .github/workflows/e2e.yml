name: E2E

on:
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cp .env.example infra/.env
      - name: Start dev stack
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml --env-file infra/.env up -d --build
          bash scripts/dev-up.sh --wait-only
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
      - if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml --env-file infra/.env down -v
