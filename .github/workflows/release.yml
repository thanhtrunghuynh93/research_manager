name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/rm-backend:${{ github.ref_name }}
          sbom: true
          provenance: true
      - name: Caddy image with frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/rm-caddy:${{ github.ref_name }}
          sbom: true
          provenance: true
      - name: Release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
