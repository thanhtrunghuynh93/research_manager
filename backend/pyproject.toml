[project]
name = "research-management-backend"
version = "0.1.0"
description = "Research Management System — API and worker"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "procrastinate>=3.9",
  "boto3>=1.35",
  "httpx>=0.27",
  "typer>=0.12",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "uuid6>=2024.7.10",
  "openai>=1.50",
  "prometheus-client>=0.21",
  "orjson>=3.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.8",
  "factory-boy>=3.3",
  "time-machine>=2.15",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "import-linter>=2.1",
  "boto3-stubs[s3]>=1.35",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unreachable = true
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "unit: pure functions, no I/O",
  "module: service-level tests against a real database",
  "acceptance: one test per requirements acceptance scenario",
  "evaluation: AI evaluation harness, run only with RM_EVAL=1",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "app/cli.py"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------- import-linter
# Enforces the dependency rule in docs/architecture.md section 4.1 and docs/repo_layout.md section 3.3.
[tool.importlinter]
root_package = "app"
include_external_packages = true  # needed to forbid the external `openai` package below

[[tool.importlinter.contracts]]
name = "Layered bounded contexts"
type = "layers"
layers = [
  "app.assistant",
  "app.assessment",
  "app.evidence",
  "app.reporting",
  "app.projects",
  "app.identity",
  "app.core",
]

[[tool.importlinter.contracts]]
name = "Only assessment and assistant use the AI gateway"
type = "forbidden"
source_modules = [
  "app.identity",
  "app.projects",
  "app.reporting",
  "app.evidence",
  "app.notifications",
  "app.api",
  "app.core",
]
forbidden_modules = ["app.ai"]

[[tool.importlinter.contracts]]
name = "Only the gateway imports the OpenAI SDK"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["openai"]
ignore_imports = ["app.ai.gateway -> openai"]
unmatched_ignore_imports_alerting = "none"  # gateway lands in a later PR

[[tool.importlinter.contracts]]
name = "Notifications depend on reporting and core only"
type = "forbidden"
source_modules = ["app.notifications"]
forbidden_modules = ["app.evidence", "app.assessment", "app.assistant"]

[[tool.importlinter.contracts]]
name = "API never touches ORM models directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
  "app.identity.models",
  "app.projects.models",
  "app.reporting.models",
  "app.evidence.models",
  "app.assessment.models",
  "app.assistant.models",
  "app.notifications.models",
]
