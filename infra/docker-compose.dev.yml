# Development overrides: hot reload, exposed ports, mailpit instead of a real mail provider,
# no caddy/backup (the Vite dev server proxies /api to the api container).
services:
  caddy:
    profiles: ["prod-only"]

  backup:
    profiles: ["prod-only"]

  api:
    build:
      context: ../backend
      target: builder
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend:/app
      - ${RM_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    ports:
      # host:container — the container keeps 8000, which is what Caddy and the healthcheck use.
      - "8021:8000"
    environment:
      RM_ENV: dev

  worker:
    build:
      context: ../backend
      target: builder
    command: ["uv", "run", "python", "-m", "app.worker"]
    volumes:
      - ../backend:/app
      - ${RM_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    environment:
      RM_ENV: dev

  postgres:
    ports:
      # host:container — the container keeps 5432, which is what RM_DATABASE_URL and the backup
      # scripts address it by on the compose network.
      - "8022:5432"

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "8026:9001"   # console

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    restart: unless-stopped
