# Production stack for one VPS (architecture §3). Start:  docker compose --env-file .env up -d
# Development overrides live in docker-compose.dev.yml (see Makefile `dev`).
name: research-management

x-backend: &backend
  image: ${RM_BACKEND_IMAGE:-rm-backend:local}
  build:
    context: ../backend
  env_file: .env
  volumes:
    # The GitHub App private key, read-only. Without it the connector falls back to the in-memory
    # one and a connected repository would silently report no activity (REPO-01, AC-04).
    - ${RM_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: ${RM_CADDY_IMAGE:-rm-caddy:local}
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      RM_DOMAIN: ${RM_DOMAIN:-localhost}
      # Without this line the Caddyfile's {$RM_ACME_EMAIL} placeholder always falls back, however
      # the host .env is filled in: this container has no env_file, so an unlisted variable is
      # unset. The `:-` default matters too — Caddy's `email` directive rejects an empty argument
      # outright ("wrong argument count"), so passing the variable through empty would take the
      # whole site down rather than misrouting a notice. scripts/preflight.sh is what refuses an
      # empty value, before the deploy rather than during it.
      RM_ACME_EMAIL: ${RM_ACME_EMAIL:-admin@example.edu}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # The image's HEALTHCHECK curls /api/healthz, which is right for the api and meaningless here:
    # the worker shares the image and serves no HTTP, so it reported "unhealthy" from the moment it
    # started while consuming jobs perfectly. A container that is permanently unhealthy and
    # permanently fine is worse than one with no healthcheck, because it teaches an operator to
    # ignore the column.
    #
    # Its liveness is checked where the answer actually lives: /api/readyz reads the queue and
    # reports whether anything is consuming it, which is the question worth asking and one no
    # per-container probe can answer.
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # quay.io, not Docker Hub: `minio/minio` there is no longer publicly pullable
    # (`pull access denied`), and quay serves the same pinned release.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file: .env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    build:
      context: ./backup
    env_file: .env
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - backups:/backups
      - ${RM_AGE_RECIPIENTS_FILE:-./backup/age-recipients.txt}:/run/age-recipients.txt:ro
      - ${RM_RCLONE_CONF:-./backup/rclone.conf}:/root/.config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  objects:
  backups:
  caddy-data:
  caddy-config:
