# Tuned for a single VPS with ~8 GB RAM shared with the api, worker, and MinIO.
# Adjust shared_buffers / effective_cache_size to the actual host.
listen_addresses = '*'
max_connections = 100

# Sized for a 4 GB host that also runs the api, the worker, MinIO and Caddy (architecture §3:
# "tuned for the host"). The earlier 1GB/3GB pair described a machine with Postgres largely to
# itself; on this one it promised most of the box to a single container and left the worker — the
# assessment pipeline is the heavy path — competing with it for what was left.
#
# effective_cache_size is an estimate the planner uses, not an allocation, so it is set to what
# the kernel can plausibly cache here rather than to the machine's total.
shared_buffers = 512MB
effective_cache_size = 2GB
# 16MB per sort node, not per connection: a query with several of them multiplies this. With
# max_connections at 100 the worst case is far past the host's memory, so it stays modest and the
# occasional large sort spills to disk rather than the OOM killer choosing a victim.
work_mem = 8MB
maintenance_work_mem = 192MB

wal_level = replica
max_wal_size = 2GB
checkpoint_completion_target = 0.9

random_page_cost = 1.1          # SSD
effective_io_concurrency = 200

log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# pgvector HNSW builds benefit from more maintenance memory; raised per-session in the index job.
