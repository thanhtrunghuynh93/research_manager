# Tuned for a single VPS with ~8 GB RAM shared with the api, worker, and MinIO.
# Adjust shared_buffers / effective_cache_size to the actual host.
listen_addresses = '*'
max_connections = 100

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

wal_level = replica
max_wal_size = 2GB
checkpoint_completion_target = 0.9

random_page_cost = 1.1          # SSD
effective_io_concurrency = 200

log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# pgvector HNSW builds benefit from more maintenance memory; raised per-session in the index job.
